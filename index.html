<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechStore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<button class="zoombtn" id="zoombtn" type="button"></button>
<div class="stage" id="stage">
  <div id="notes"></div>
  <div class="screen" id="screen">
    <div class="viewport" id="vp">
      <div class="scroller" id="scroller">
        <div class="site">
          <div class="strip"><div class="wrap">
            <span class="promo">Esquenta Black Friday</span>
            <span>Acaba em <span class="cd" id="bfcd">—</span></span>
            <span><b>10% off</b> no PIX · cupom <b>TECH10</b> +10%</span>
          </div></div>
          <div class="sticky">
            <div class="wrap hdr">
              <button class="logo" type="button" data-tab="inicio" aria-label="TechStore, início">
                <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="4" fill="#2E6BFF"/><path d="M9 11h14M16 11v12" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="square"/><path d="M5 9h-2M5 16h-2M5 23h-2M29 9h-2M29 16h-2M29 23h-2" stroke="#2E6BFF" stroke-width="2"/></svg>
                <span class="promo">Tech<i>Store</i></span>
              </button>
              <label class="search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
                <input id="q" type="search" placeholder="Buscar RTX 5060, DDR5, Ryzen…" aria-label="Buscar produtos" autocomplete="off">
              </label>
              <button class="cartbtn" id="openCart" type="button" aria-label="Abrir carrinho">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
                <span class="lbl">Carrinho</span><span class="n" id="cartN">0</span>
              </button>
            </div>
            <div class="wrap tabbar" id="tabbar">
              <button class="tarr" type="button" data-tscroll="-1" id="tprev" aria-label="Abas anteriores">‹</button>
              <nav class="tabs" id="tabs" role="tablist" aria-label="Departamentos"></nav>
              <button class="tarr" type="button" data-tscroll="1" id="tnext" aria-label="Próximas abas">›</button>
            </div>
            <div class="wrap tabtrack-wrap" id="ttwrap"><div class="tabtrack" id="ttrack" title="Arraste para ver todas as abas"><div class="tabthumb" id="tthumb"></div></div></div>
          </div>
          <main class="wrap" id="main"></main>
          <footer><div class="wrap"><span class="promo">TechStore</span><span>João Pessoa, PB · Loja de demonstração, preços ilustrativos.</span></div></footer>
        </div>
      </div>

      <div class="shade" id="shade"></div>
      <section class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Detalhes do produto"></section>
      <aside class="drawer" id="drawer" aria-label="Carrinho">
        <div class="ohead"><h3 class="promo">Carrinho</h3><button class="x" type="button" data-close aria-label="Fechar carrinho">×</button></div>
        <div class="items" id="items"></div>
        <div class="sum" id="sum"></div>
      </aside>
      <div class="toast" id="toast" role="status"></div>
    </div>
  </div>
</div>


<script src="js/script.js"></script>
</body>
</html>
